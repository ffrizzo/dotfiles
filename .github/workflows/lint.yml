name: Lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Strip chezmoi template guards for linting
        run: |
          mkdir -p /tmp/lint
          for f in .chezmoiscripts/*.tmpl; do
            base=$(basename "$f" .tmpl)
            sed -E 's/\{\{.*\}\}//g' "$f" > "/tmp/lint/$base"
          done

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: /tmp/lint
          shellcheck_options: --shell=bash
